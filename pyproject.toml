[project]
name = "HomeoRemedica"
version = "6.0.0"
description = "HomeoRemedica web chat app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
  "fastapi>=0.141.1,<1",
  "fastembed>=0.8,<1",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.10.1,<3",
  "qdrant-client>=1.15,<2",
  "requests>=2.34.2,<3",
  "uvicorn>=0.52.4,<1",
]

[build-system]
requires = ["uv-build>=0.11.23,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "build>=1.3.0,<2",
  "httpx>=0.28.1,<1",
  "pip-audit>=2.10.1,<3",
  "pyright>=1.1.405,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12.11,<0.13",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.uv]
required-version = ">=0.11.23,<0.12"

[tool.uv.build-backend]
module-name = ["shared", "production", "api"]
