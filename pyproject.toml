[project]
name = "HomeoRemedica"
version = "2.1.1"
description = "HomeoRemedica terminal client and RAG corpus release tooling"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "google-auth[requests]>=2.56.3,<3",
  "google-cloud-storage>=3.13.1,<4",
  "google-genai>=2.18.1,<3",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.10.1,<3",
  "sqlite-vec==0.1.9",
]

[project.scripts]
homeoremedica = "homeoremedica_chat.cli:main"
homeoremedica-corpus = "homeoremedica_corpus.cli:main"

[build-system]
requires = ["uv-build>=0.11.23,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "build>=1.3.0,<2",
  "pip-audit>=2.10.1,<3",
  "pyright>=1.1.405,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12.11,<0.13",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.uv]
required-version = ">=0.11.23,<0.12"

[tool.uv.build-backend]
module-name = ["homeoremedica_chat", "homeoremedica_corpus"]
