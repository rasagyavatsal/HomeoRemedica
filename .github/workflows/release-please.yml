name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.release.outputs.release_created }}
      android: ${{ steps.release.outputs['android--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-web:
    needs: release-please
    if: needs.release-please.outputs.web == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-web.yml

  deploy-android:
    needs: release-please
    if: needs.release-please.outputs.android == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-android.yml
    secrets: inherit
